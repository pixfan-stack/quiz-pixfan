# Cloudflare Pages configuration for Quiz PixFan
# See: https://developers.cloudflare.com/pages/functions/bindings/

name = "quiz-pixfan"
pages_build_output_dir = "dist"

[vars]
# Application configuration (Pages Functions / wrangler).
# Do NOT put ADMIN_PIN / VITE_ADMIN_PIN here (secrets).
# - SPA: set VITE_ADMIN_PIN as a *build* secret (CI / Pages build env), redeploy.
# - Functions (/api/admin/*): set runtime ADMIN_PIN (preferred) or VITE_ADMIN_PIN
#   on the Pages project (Dashboard → Settings → Environment variables).
#   Code accepts either via authorizeAdmin() in functions/api/admin/auth.ts.
VITE_APP_URL = "https://quiz.pixfan.fr"
VITE_ENABLE_REMOTE_SCORES = true

# D1 Database binding for high scores
[[d1_databases]]
binding = "DB"
database_name = "quiz-pixfan-scores"
database_id = "106190e3-515c-48ed-869a-d4b7c72a0796"

# KV Namespace binding (alternative to D1, uncomment if using KV instead)
# [[kv_namespaces]]
# binding = "QUIZ_SCORES"
# id = "YOUR_KV_NAMESPACE_ID_HERE"
